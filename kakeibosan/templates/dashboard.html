{% extends 'base.html' %}
{% block title %}{% endblock %}
{% block header %}
{% endblock%}
{% block contents %}
        <div class="panel-header panel-header-lg">
            <canvas id="bigDashboardChart"></canvas>
        </div>
        <div class="content">
            <div class="row">
                <div class="col-md-6">
                    <div class="card card-chart">
                        <div class="card-header">
                            <h5 class="card-category">{{ '{0:%Y年%-m月}'.format(this_month) }}</h5>
                            <h4 class="card-title">出費割合</h4>
                        </div>
                        <div class="card-body">
                            <canvas id="pieChart"></canvas>
                        </div>
                    </div>
                </div>
                {%- for view_category in view_category_list %}
                <div class="col-md-6">
                    <div class="card card-chart">
                        <div class="card-header">
                            <h4 class="card-title">{{ view_category.name }}</h4>
                        </div>
                        <div class="card-body">
                            <canvas id="lineChart{{ view_category.in_english }}"></canvas>
                        </div>
                    </div>
                </div>
                {%- endfor %}
            </div>
        </div>
        {% endblock %}
{% block footer %}
    <!-- Chart JS -->
    <script src="{{ url_for('static', filename='js/vendor/chartjs.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
    <script>
        $(document).ready(function () {
            initDashboardPageCharts(
                {{ this_month.month | tojson }},
                {{ total_costs_last_year | tojson }},
                {{ total_costs_this_year | tojson }},
                {{ costs_this_month_by_category | tojson }},
                {{ utility_last_year | tojson }},
                {{ utility_this_year | tojson }},
                {{ view_category_list | tojson }},
            );
        });
    </script>
{% endblock %}
